[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdgt-cma"
version = "0.2.0"
description = "Physics-guided dynamic graph transformer for multi-site PM2.5 forecasting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "torch>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "matplotlib>=3.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
era5 = ["cdsapi>=0.7", "xarray>=2024.6", "netCDF4>=1.7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::RuntimeWarning:src.utils.seeding"]

[tool.ruff]
line-length = 100
target-version = "py310"
